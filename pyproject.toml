[project]
name = "recordranks-og-images"
version = "0.1.0"
description = "Service for generating OG images for RecordRanks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiocache>=0.12.0",
    "fastapi[standard]>=0.141.1",
    "playwright>=1.62.0",
    "pydantic-settings>=2.15.0",
]

[tool.fastapi]
    entrypoint = "main:app"
